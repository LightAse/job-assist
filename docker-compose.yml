services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: job-assist-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_INTERNAL_PORT: 8000
      JOB_ASSIST_DB_PATH: /app/data/job_assist.db
    volumes:
      - job_assist_data:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: job-assist-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  job_assist_data:
